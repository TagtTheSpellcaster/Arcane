<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniziativa - TTRPG</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .init-card { display: flex; justify-content: space-between; align-items: center; background: var(--bg-primary); border: 1px solid var(--border-dark); padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 0.5rem; }
    .init-card.active { border-color: var(--accent-gold); box-shadow: 0 0 10px rgba(212,175,55,0.2); }
    .badge { padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; text-transform: uppercase; font-weight: bold; }
    .badge-pg { background: #1e3a8a; color: #93c5fd; }
    .badge-mob { background: #7f1d1d; color: #fca5a5; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="brand"><i class="fas fa-dragon fa-2x"></i> <span class="brand-title">TTRPG Toolbox</span></a>
    <ul class="nav-links">
      <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
      <li><a href="dice.html"><i class="fas fa-dice-d20"></i> Dadi</a></li>
      <li><a href="initiative.html" class="active"><i class="fas fa-list-ol"></i> Iniziativa</a></li>
      <li><a href="names.html"><i class="fas fa-user-tag"></i> NPG</a></li>
      <li><a href="notes.html"><i class="fas fa-book"></i> Note</a></li>
    </ul>
  </nav>

  <div class="container">
    <div class="card">
      <h2>Aggiungi Combattente</h2>
      <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 0.5rem; margin-top: 1rem;" id="addForm">
        <input type="text" id="name" placeholder="Nome Personaggio / Mostro">
        <input type="number" id="init" placeholder="Iniziativa">
        <input type="number" id="hp" placeholder="PV Max">
        <select id="type"><option value="pg">PG</option><option value="mob">Mostro</option></select>
        <button class="btn" onclick="addCombatant()">Aggiungi</button>
      </div>
    </div>

    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2>Ordine di Iniziativa (Round: <span id="roundNum">1</span>)</h2>
        <div>
          <button class="btn" onclick="nextTurn()">Prossimo Turno</button>
          <button class="btn btn-crimson" onclick="clearAll()">Svuota</button>
        </div>
      </div>
      <div id="combatList"></div>
    </div>
  </div>

  <script>
    let combatants = [];
    let currentTurn = 0;
    let round = 1;

    function addCombatant() {
      const name = document.getElementById('name').value;
      const init = parseInt(document.getElementById('init').value) || 0;
      const hp = parseInt(document.getElementById('hp').value) || 10;
      const type = document.getElementById('type').value;

      if(!name) return;

      combatants.push({ id: Date.now(), name, init, hp, maxHp: hp, type });
      combatants.sort((a,b) => b.init - a.init);
      document.getElementById('name').value = '';
      renderList();
    }

    function modHp(id, amount) {
      let c = combatants.find(x => x.id === id);
      if(c) {
        c.hp += amount;
        renderList();
      }
    }

    function nextTurn() {
      if(combatants.length === 0) return;
      currentTurn++;
      if(currentTurn >= combatants.length) {
        currentTurn = 0;
        round++;
        document.getElementById('roundNum').innerText = round;
      }
      renderList();
    }

    function clearAll() {
      combatants = [];
      currentTurn = 0;
      round = 1;
      document.getElementById('roundNum').innerText = round;
      renderList();
    }

    function renderList() {
      const list = document.getElementById('combatList');
      list.innerHTML = '';
      combatants.forEach((c, idx) => {
        const item = document.createElement('div');
        item.className = `init-card ${idx === currentTurn ? 'active' : ''}`;
        item.innerHTML = `
          <div style="display:flex; align-items:center; gap:1rem;">
            <strong style="font-size: 1.2rem; color: var(--accent-gold); width:30px;">${c.init}</strong>
            <div>
              <strong>${c.name}</strong> 
              <span class="badge ${c.type === 'pg' ? 'badge-pg' : 'badge-mob'}">${c.type}</span>
            </div>
          </div>
          <div>
            PV: <strong>${c.hp}</strong>/${c.maxHp}
            <button class="btn" style="padding:0.2rem 0.4rem; margin-left:0.5rem;" onclick="modHp(${c.id}, 1)">+</button>
            <button class="btn btn-crimson" style="padding:0.2rem 0.4rem;" onclick="modHp(${c.id}, -1)">-</button>
          </div>
        `;
        list.appendChild(item);
      });
    }
  </script>
</body>
</html>
