<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generatore NPG - TTRPG</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="brand"><i class="fas fa-dragon fa-2x"></i> <span class="brand-title">TTRPG Toolbox</span></a>
    <ul class="nav-links">
      <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
      <li><a href="dice.html"><i class="fas fa-dice-d20"></i> Dadi</a></li>
      <li><a href="initiative.html"><i class="fas fa-list-ol"></i> Iniziativa</a></li>
      <li><a href="names.html" class="active"><i class="fas fa-user-tag"></i> NPG</a></li>
      <li><a href="notes.html"><i class="fas fa-book"></i> Note</a></li>
    </ul>
  </nav>

  <div class="container">
    <div class="card" style="max-width: 600px; margin: 0 auto;">
      <h2>Generatore Casuale NPG</h2>
      <button class="btn" style="width: 100%; margin: 1rem 0;" onclick="generateNpc()">Genera Personaggio</button>

      <div id="npcCard" style="display: none; background: var(--bg-primary); border: 1px solid var(--border-gold); padding: 1.5rem; border-radius: 6px;">
        <h3 id="npcName" style="color: var(--accent-gold); font-size: 1.5rem;"></h3>
        <p style="color: var(--text-muted); font-style: italic;" id="npcRaceClass"></p>
        <hr style="border-color: var(--border-dark); margin: 1rem 0;">
        <p><strong>Personalità:</strong> <span id="npcTrait"></span></p>
        <p><strong>Segno Particolare:</strong> <span id="npcLook"></span></p>
        <p><strong>Obiettivo:</strong> <span id="npcGoal"></span></p>
      </div>
    </div>
  </div>

  <script>
    const firstNames = ["Valerius", "Eldrin", "Garrick", "Lyra", "Mireia", "Thorne", "Kaelen", "Brak", "Zehra"];
    const lastNames = ["Ironfist", "Shadowweaver", "Brightwood", "Stormcaller", "Ravencrest", "Bloodaxe"];
    const races = ["Umano", "Elfo", "Nano", "Halfling", "Tiefling", "Orco"];
    const jobs = ["Mercante", "Guardia", "Fabbro", "Nobile", "Locandiere", "Mercenario", "Mago vagabondo"];
    const traits = ["Cauto e sospettoso", "Estremamente allegro", "Sempre distratto", "Molto arrogante", "Misterioso e lacónico"];
    const looks = ["Cicatrice sul volto", "Occhi di colore diverso", "Veste elegantissima", "Accento straniero", "Tic nervoso alle mani"];
    const goals = ["Cerca un parente scomparso", "Deve ripagare un grosso debito", "Vuole vendere un artefatto", "Cerca protezione"];

    function generateNpc() {
      const fname = firstNames[Math.floor(Math.random() * firstNames.length)];
      const lname = lastNames[Math.floor(Math.random() * lastNames.length)];
      const race = races[Math.floor(Math.random() * races.length)];
      const job = jobs[Math.floor(Math.random() * jobs.length)];

      document.getElementById('npcName').innerText = `${fname} ${lname}`;
      document.getElementById('npcRaceClass').innerText = `${race} - ${job}`;
      document.getElementById('npcTrait').innerText = traits[Math.floor(Math.random() * traits.length)];
      document.getElementById('npcLook').innerText = looks[Math.floor(Math.random() * looks.length)];
      document.getElementById('npcGoal').innerText = goals[Math.floor(Math.random() * goals.length)];

      document.getElementById('npcCard').style.display = 'block';
    }
  </script>
</body>
</html>
