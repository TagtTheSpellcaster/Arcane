<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lancia Dadi - TTRPG</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .dice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .dice-btn { background: var(--bg-primary); border: 2px solid var(--border-gold); padding: 1rem; border-radius: 8px; cursor: pointer; text-align: center; color: var(--accent-gold); font-family: 'Cinzel'; font-weight: bold; font-size: 1.2rem; transition: 0.2s; }
    .dice-btn:hover { background: var(--accent-gold); color: var(--bg-primary); transform: translateY(-2px); }
    .result-box { background: var(--bg-primary); border: 2px solid var(--accent-gold); border-radius: 8px; padding: 2rem; text-align: center; margin-bottom: 1.5rem; }
    .result-num { font-size: 4rem; font-family: 'Cinzel'; color: var(--accent-gold); font-weight: 900; }
    .log-item { padding: 0.5rem; border-bottom: 1px solid var(--border-dark); font-size: 0.9rem; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="brand"><i class="fas fa-dragon fa-2x"></i> <span class="brand-title">TTRPG Toolbox</span></a>
    <ul class="nav-links">
      <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
      <li><a href="dice.html" class="active"><i class="fas fa-dice-d20"></i> Dadi</a></li>
      <li><a href="initiative.html"><i class="fas fa-list-ol"></i> Iniziativa</a></li>
      <li><a href="names.html"><i class="fas fa-user-tag"></i> NPG</a></li>
      <li><a href="notes.html"><i class="fas fa-book"></i> Note</a></li>
    </ul>
  </nav>

  <div class="container">
    <div class="grid-2">
      <div>
        <div class="card">
          <h2>Seleziona Dado</h2>
          <div class="dice-grid" style="margin-top: 1rem;">
            <div class="dice-btn" onclick="roll(4)">d4</div>
            <div class="dice-btn" onclick="roll(6)">d6</div>
            <div class="dice-btn" onclick="roll(8)">d8</div>
            <div class="dice-btn" onclick="roll(10)">d10</div>
            <div class="dice-btn" onclick="roll(12)">d12</div>
            <div class="dice-btn" onclick="roll(20)">d20</div>
            <div class="dice-btn" onclick="roll(100)">d100</div>
          </div>
          <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem;">
            <label>Quantità: <input type="number" id="diceCount" value="1" min="1" max="20" style="width: 70px;"></label>
            <label>Modificatore: <input type="number" id="diceMod" value="0" style="width: 70px;"></label>
          </div>
          <div style="display: flex; gap: 0.5rem;">
            <button class="btn" onclick="rollAdvantage('adv')">Vantaggio (d20)</button>
            <button class="btn btn-crimson" onclick="rollAdvantage('dis')">Svantaggio (d20)</button>
          </div>
        </div>
      </div>

      <div>
        <div class="card">
          <div class="result-box">
            <div style="color: var(--text-muted); font-size: 0.9rem;">Risultato</div>
            <div class="result-num" id="resVal">-</div>
            <div id="resDetail" style="color: var(--text-muted); font-size: 0.85rem;">Seleziona un dado per tirare</div>
          </div>
          <h3>Storico Lanci</h3>
          <div id="rollLog" style="max-height: 200px; overflow-y: auto; margin-top: 0.5rem;"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function roll(faces) {
      const count = parseInt(document.getElementById('diceCount').value) || 1;
      const mod = parseInt(document.getElementById('diceMod').value) || 0;
      let rolls = [];
      let sum = 0;

      for(let i=0; i<count; i++) {
        let r = Math.floor(Math.random() * faces) + 1;
        rolls.push(r);
        sum += r;
      }
      let total = sum + mod;
      let detail = `${count}d${faces} (${rolls.join(', ')}) ${mod >= 0 ? '+'+mod : mod}`;
      
      showResult(total, detail);
    }

    function rollAdvantage(type) {
      const mod = parseInt(document.getElementById('diceMod').value) || 0;
      let r1 = Math.floor(Math.random() * 20) + 1;
      let r2 = Math.floor(Math.random() * 20) + 1;
      let chosen = type === 'adv' ? Math.max(r1, r2) : Math.min(r1, r2);
      let total = chosen + mod;
      let detail = `${type.toUpperCase()} [${r1}, ${r2}] -> presi ${chosen} ${mod >= 0 ? '+'+mod : mod}`;
      
      showResult(total, detail);
    }

    function showResult(val, detail) {
      document.getElementById('resVal').innerText = val;
      document.getElementById('resDetail').innerText = detail;

      const log = document.getElementById('rollLog');
      const item = document.createElement('div');
      item.className = 'log-item';
      item.innerHTML = `<span>${detail}</span><strong>${val}</strong>`;
      log.prepend(item);
    }
  </script>
</body>
</html>
